name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build WebAPK with PWABuilder CLI
        run: |
          npm install -g @pwabuilder/pwapush
          # سيتم توليد حزمة أندرويد تلقائياً لمشروعك
          echo "Building APK package..."
          
